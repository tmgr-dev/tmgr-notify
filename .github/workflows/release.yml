name: Release

on:
  push:
    tags: ['v*']

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - name: Check tag matches package version
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "$(node -p "require('./package.json').version")" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version" >&2
            exit 1
          fi
      - name: Check optionalDependencies match package version
        run: |
          node -e '
            const p = require("./package.json");
            const bad = Object.entries(p.optionalDependencies ?? {}).filter(([, v]) => v !== p.version);
            if (bad.length === 0 && Object.keys(p.optionalDependencies ?? {}).length === 0) bad.push(["optionalDependencies", "missing"]);
            if (bad.length) { console.error("optionalDependencies out of sync:", bad); process.exit(1); }
          '
      - name: Build platform packages
        run: node dist/tools/build-platform-packages.js --out dist-npm
      - name: Publish platform packages
        run: |
          set -eu
          version="$(node -p "require('./package.json').version")"
          for dir in dist-npm/*/; do
            name="$(node -p "require('./${dir}package.json').name")"
            if [ "$(npm view "${name}@${version}" version 2>/dev/null || true)" = "$version" ]; then
              echo "${name}@${version} already published, skipping"
              continue
            fi
            (cd "$dir" && npm publish --provenance --access public)
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
